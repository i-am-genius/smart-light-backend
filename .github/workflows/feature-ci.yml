name: Feature CI

on:
  push:
    branches:
      - agent/garment-calibration-source-lighting
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw test
