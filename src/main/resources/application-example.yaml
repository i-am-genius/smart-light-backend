server:
  port: 3000

spring:
  application:
    name: smart-light-backend

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/smart_light?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

ai:
  fabric:
    url: ${AI_FABRIC_URL:http://127.0.0.1:5011/predict}
  flow:
    url: ${AI_FLOW_URL:http://127.0.0.1:5000/detect_binary}

jwt:
  secret: ${JWT_SECRET:change-me-at-least-32-chars}
  expire-millis: ${JWT_EXPIRE_MILLIS:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  file:
    path: /opt/smartlight/logs
